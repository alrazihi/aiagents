name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check gemini_agent_toolkit tests/
      - name: Type check
        run: mypy gemini_agent_toolkit --ignore-missing-imports
      - name: Test
        run: pytest -v
